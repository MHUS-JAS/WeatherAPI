<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TV Weather Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4vh 5vw;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 2vh;
    }
    .city { font-size: 4.5vh; font-weight: 700; letter-spacing: -0.5px; }
    .clock { font-size: 3.5vh; color: #94a3b8; font-variant-numeric: tabular-nums; }
    .current {
      display: flex;
      align-items: center;
      justify-content: space-between;
      my: auto;
    }
    .temp-main { font-size: 18vh; font-weight: 800; line-height: 1; }
    .details { text-align: right; font-size: 3.2vh; color: #cbd5e1; line-height: 1.6; }
    .condition { font-size: 5vh; font-weight: 600; color: #38bdf8; }
    .forecast {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 2vw;
    }
    .day-card {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 2.5vh 1.5vw;
      text-align: center;
    }
    .day-name { font-size: 2.8vh; font-weight: 600; color: #94a3b8; margin-bottom: 1vh; }
    .day-temps { font-size: 3.6vh; font-weight: 700; }
    .day-low { color: #64748b; font-weight: 400; margin-left: 0.5vw; }
  </style>
</head>
<body>
  <div class="header">
    <div class="city" id="city">Local Weather</div>
    <div class="clock" id="clock">--:--</div>
  </div>

  <div class="current">
    <div class="temp-main" id="temp">--°</div>
    <div class="details">
      <div class="condition" id="condition">Loading...</div>
      <div id="feels">Feels like --°</div>
      <div id="wind">Wind -- mph</div>
    </div>
  </div>

  <div class="forecast" id="forecast"></div>

  <script>
    // 1. CUSTOMIZE THESE THREE VALUES
    const LAT = 27.0442;
    const LON = -82.2359;
    const CITY_NAME = "North Port, FL";

    document.getElementById("city").textContent = CITY_NAME;

    const weatherCodes = {
      0: "Clear Sky", 1: "Mainly Clear", 2: "Partly Cloudy", 3: "Overcast",
      45: "Fog", 48: "Rime Fog", 51: "Light Drizzle", 53: "Drizzle",
      61: "Light Rain", 63: "Rain", 65: "Heavy Rain", 71: "Light Snow",
      80: "Rain Showers", 95: "Thunderstorm"
    };

    function updateClock() {
      const now = new Date();
      document.getElementById("clock").textContent = now.toLocaleTimeString([], {
        hour: "2-digit", minute: "2-digit"
      });
    }

    async function fetchWeather() {
      const url = `https://open-meteo.com{LAT}&longitude=${LON}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto`;
      try {
        const res = await fetch(url);
        const data = await res.json();

        document.getElementById("temp").textContent = `${Math.round(data.current.temperature_2m)}°`;
        document.getElementById("condition").textContent = weatherCodes[data.current.weather_code] || "Current Conditions";
        document.getElementById("feels").textContent = `Feels like ${Math.round(data.current.apparent_temperature)}°`;
        document.getElementById("wind").textContent = `Wind ${Math.round(data.current.wind_speed_10m)} mph`;

        const forecastEl = document.getElementById("forecast");
        forecastEl.innerHTML = "";
        for (let i = 0; i < 5; i++) {
          const date = new Date(data.daily.time[i] + "T12:00:00");
          const day = i === 0 ? "Today" : date.toLocaleDateString([], { weekday: "short" });
          const hi = Math.round(data.daily.temperature_2m_max[i]);
          const lo = Math.round(data.daily.temperature_2m_min[i]);

          forecastEl.innerHTML += `
            <div class="day-card">
              <div class="day-name">${day}</div>
              <div class="day-temps">${hi}° <span class="day-low">${lo}°</span></div>
            </div>
          `;
        }
      } catch (err) {
        console.error("Weather fetch failed:", err);
      }
    }

    updateClock();
    fetchWeather();
    setInterval(updateClock, 1000);
    setInterval(fetchWeather, 15 * 60 * 1000); // Refresh weather every 15 minutes
  </script>
</body>
</html>
