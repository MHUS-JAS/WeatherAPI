<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TV Weather Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4vh 5vw;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 2vh;
    }
    .city { font-size: 4.5vh; font-weight: 700; letter-spacing: -0.5px; }
    .clock { font-size: 3.5vh; color: #94a3b8; font-variant-numeric: tabular-nums; }
    .current {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: auto 0;
    }
    .temp-main { font-size: 18vh; font-weight: 800; line-height: 1; }
    .details { text-align: right; font-size: 3.2vh; color: #cbd5e1; line-height: 1.6; }
    .condition { font-size: 5vh; font-weight: 600; color: #38bdf8; }
    .forecast {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 2vw;
    }
    .day-card {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 2.5vh 1.5vw;
      text-align: center;
    }
    .day-name { font-size: 2.8vh; font-weight: 600; color: #94a3b8; margin-bottom: 1vh; }
    .day-temps { font-size: 3.6vh; font-weight: 700; }
    .day-desc { font-size: 2vh; color: #cbd5e1; margin-top: 0.8vh; }
    #error-box {
      display: none;
      background: #7f1d1d;
      color: #fecaca;
      padding: 1.5vh 2vw;
      border-radius: 8px;
      font-size: 2.2vh;
      margin-top: 1vh;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="city" id="city">North Port, FL</div>
    <div class="clock" id="clock">--:--</div>
  </div>

  <div id="error-box"></div>

  <div class="current">
    <div class="temp-main" id="temp">--°</div>
    <div class="details">
      <div class="condition" id="condition">Loading...</div>
      <div id="humidity">Humidity --%</div>
      <div id="wind">Wind -- mph</div>
    </div>
  </div>

  <div class="forecast" id="forecast"></div>

  <script>
    const LAT = 27.0442;
    const LON = -82.2359;
    const CITY_NAME = "North Port, FL";

    const errorBox = document.getElementById("error-box");
    function showError(msg) {
      errorBox.style.display = "block";
      errorBox.textContent = "Debug Info: " + msg;
    }

    document.getElementById("city").textContent = CITY_NAME;

    function updateClock() {
      const now = new Date();
      document.getElementById("clock").textContent = now.toLocaleTimeString([], {
        hour: "2-digit", minute: "2-digit"
      });
    }

    async function fetchWithTimeout(url) {
      const controller = new AbortController();
      const id = setTimeout(function() { controller.abort(); }, 10000);
      const res = await fetch(url, { signal: controller.signal });
      clearTimeout(id);
      if (!res.ok) throw new Error("HTTP " + res.status + " on " + url);
      return res.json();
    }

    async function fetchWeather() {
      try {
        // Build URL safely from segments so copy-paste never strips slashes or subdomains
        const pointUrl = ["https:", "", "api.weather.gov", "points", LAT + "," + LON].join("/");
        const pointData = await fetchWithTimeout(pointUrl);
        const forecastUrl = pointData.properties.forecast;
        const stationsUrl = pointData.properties.observationStations;

        // Get nearest active weather station observation
        const stationsData = await fetchWithTimeout(stationsUrl);
        const nearestStation = stationsData.features.at(0).id;
        const obsData = await fetchWithTimeout(nearestStation + "/observations/latest");
        const obs = obsData.properties;

        // Get 7-day forecast periods
        const forecastData = await fetchWithTimeout(forecastUrl);
        const periods = forecastData.properties.periods;
        const firstPeriod = periods.at(0);

        errorBox.style.display = "none";

        const tempF = obs.temperature && obs.temperature.value !== null
          ? Math.round((obs.temperature.value * 9) / 5 + 32)
          : firstPeriod.temperature;

        const windMph = obs.windSpeed && obs.windSpeed.value !== null
          ? Math.round(obs.windSpeed.value * 0.621371)
          : firstPeriod.windSpeed;

        const humidity = obs.relativeHumidity && obs.relativeHumidity.value !== null
          ? Math.round(obs.relativeHumidity.value) + "%"
          : "--%";

        document.getElementById("temp").textContent = tempF + "°";
        document.getElementById("condition").textContent = obs.textDescription || firstPeriod.shortForecast;
        document.getElementById("humidity").textContent = "Humidity " + humidity;
        document.getElementById("wind").textContent = typeof windMph === "number" ? "Wind " + windMph + " mph" : "Wind " + windMph;

        // Render next 5 daytime forecast cards
        const forecastEl = document.getElementById("forecast");
        forecastEl.innerHTML = "";
        const dayPeriods = periods.filter(function(p) {
          return p.isDaytime || p.number === 1;
        }).slice(0, 5);

        dayPeriods.forEach(function(p) {
          forecastEl.innerHTML +=
            '<div class="day-card">' +
              '<div class="day-name">' + p.name + '</div>' +
              '<div class="day-temps">' + p.temperature + '°' + p.temperatureUnit + '</div>' +
              '<div class="day-desc">' + p.shortForecast + '</div>' +
            '</div>';
        });
      } catch (err) {
        showError(err.name === "AbortError" ? "Request timed out (network blocked API)" : err.message);
      }
    }

    updateClock();
    fetchWeather();
    setInterval(updateClock, 1000);
    setInterval(fetchWeather, 15 * 60 * 1000);
  </script>
</body>
</html>
